[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexy-lite"
version = "0.1.0"
description = "Inventory management app for grocery stores"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "Pillow>=10.4",
    "crispy-bootstrap5>=2024.10",
    "django-crispy-forms>=2.3",
    "dj-database-url>=2.2",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.3,<4",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.8"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "flexylite.settings_test"
python_files = ["tests.py", "test_*.py", "tests/test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flexylite*", "products*", "users*"]
exclude = ["media*", "templates*", "staticfiles*"]
