[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexy-lite"
version = "0.1.0"
description = "Inventory management app for grocery stores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6.1",
    "Pillow>=10.4",
    "crispy-bootstrap5>=2024.10",
    "django-crispy-forms>=2.3",
    "dj-database-url>=2.2",
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
    "whitenoise>=6.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["flexylite*", "products*", "users*"]
exclude = ["media*", "templates*", "staticfiles*"]
