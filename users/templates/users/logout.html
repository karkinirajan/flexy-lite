{% extends "base.html" %}
{% block title %}Logout{% endblock title %}

{% block content %}
<section class="surface-card auth-card text-center mx-auto" style="max-width: 720px;">
  <p class="eyebrow mb-3">Session ended</p>
  <h1 class="auth-title h2 mb-3">You have been logged out.</h1>
  <p class="auth-copy mx-auto mb-4">Sign in again when you are ready to continue managing products and stock.</p>
  <a class="btn btn-brand btn-lg" href="{% url 'login' %}">Log in again</a>
</section>
{% endblock content %}
